name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v?(\d+)\.(\d+)') {
            Write-Error "Tag '$tag' doesn't look like a version (expected e.g. v2.1 or 2.1)."
            exit 1
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "fileVersion=$major.$minor.0.0" >> $env:GITHUB_OUTPUT

      - name: Restore solution
        run: dotnet restore AMS2ChEd\AMS2ChEd.sln

      - name: Run tests
        run: dotnet test AMS2ChEd.Tests\AMS2ChEd.Tests.csproj -c Release --no-restore

      - name: Build app (also builds & stages Updater + SteamDlcCheck)
        run: >
          dotnet build AMS2ChEd\AMS2ChEd.csproj -c Release --no-restore
          -p:AssemblyVersion=${{ steps.version.outputs.fileVersion }}
          -p:FileVersion=${{ steps.version.outputs.fileVersion }}

      - name: Verify embedded version matches tag
        shell: pwsh
        run: |
          $info = (Get-Item "AMS2ChEd\bin\Release\net8.0-windows\AMS2ChEd.exe").VersionInfo
          $expectedMajor = [int]"${{ steps.version.outputs.major }}"
          $expectedMinor = [int]"${{ steps.version.outputs.minor }}"
          if ($info.FileMajorPart -ne $expectedMajor -or $info.FileMinorPart -ne $expectedMinor) {
            Write-Error "Built exe version $($info.FileMajorPart).$($info.FileMinorPart) does not match tag-derived version $expectedMajor.$expectedMinor"
            exit 1
          }

      - name: Zip release
        id: zip
        shell: pwsh
        run: |
          $zipName = "RewindGP-${{ github.ref_name }}.zip"
          Compress-Archive -Path "AMS2ChEd\bin\Release\net8.0-windows\*" -DestinationPath $zipName
          "zipName=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.zip.outputs.zipName }}" `
            --title "Rewind GP ${{ github.ref_name }}" --generate-notes
