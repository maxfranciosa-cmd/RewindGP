name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          # v2.4 is a stable release. A patch tag (v2.4.1, v2.4.2...) is an experimental build:
          # it is published as a prerelease, which the app's update check (releases/latest,
          # compared on major.minor only) never offers; launching with --forceupdate installs the newest one.
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v?(\d+)\.(\d+)(?:\.(\d+))?$') {
            Write-Error "Tag '$tag' doesn't look like a version (expected e.g. v2.1, or v2.1.1 for an experimental build)."
            exit 1
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = if ($Matches[3]) { [int]$Matches[3] } else { 0 }
          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "patch=$patch" >> $env:GITHUB_OUTPUT
          "fileVersion=$major.$minor.$patch.0" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($patch -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Restore solution
        run: dotnet restore AMS2ChEd\AMS2ChEd.sln

      - name: Run tests
        run: dotnet test AMS2ChEd.Tests\AMS2ChEd.Tests.csproj -c Release --no-restore

      - name: Build app (also builds & stages Updater + SteamDlcCheck)
        run: >
          dotnet build AMS2ChEd\AMS2ChEd.csproj -c Release --no-restore
          -p:AssemblyVersion=${{ steps.version.outputs.fileVersion }}
          -p:FileVersion=${{ steps.version.outputs.fileVersion }}

      - name: Verify embedded version matches tag
        shell: pwsh
        run: |
          $info = (Get-Item "AMS2ChEd\bin\Release\net8.0-windows\AMS2ChEd.exe").VersionInfo
          $expectedMajor = [int]"${{ steps.version.outputs.major }}"
          $expectedMinor = [int]"${{ steps.version.outputs.minor }}"
          $expectedPatch = [int]"${{ steps.version.outputs.patch }}"
          if ($info.FileMajorPart -ne $expectedMajor -or $info.FileMinorPart -ne $expectedMinor -or $info.FileBuildPart -ne $expectedPatch) {
            Write-Error "Built exe version $($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart) does not match tag-derived version $expectedMajor.$expectedMinor.$expectedPatch"
            exit 1
          }

      - name: Zip release
        id: zip
        shell: pwsh
        run: |
          $zipName = "RewindGP-${{ github.ref_name }}.zip"
          Compress-Archive -Path "AMS2ChEd\bin\Release\net8.0-windows\*" -DestinationPath $zipName
          "zipName=$zipName" >> $env:GITHUB_OUTPUT

      # The setup exe is for first installs; the zip above stays what the in-app updater uses
      # (it only picks .zip assets). Stable releases only: an experimental (patch-tag) build
      # ships as the zip alone.
      - name: Build installer
        id: installer
        if: steps.version.outputs.prerelease == 'false'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found after installing Inno Setup"; exit 1 }
          $sourceDir = (Resolve-Path "AMS2ChEd\bin\Release\net8.0-windows").Path
          $version = "${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}"
          & $iscc "/DSourceDir=$sourceDir" "/DAppVersion=$version" "/DTag=${{ github.ref_name }}" "/O$PWD" "Installer\RewindGP.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "setupName=RewindGP-Setup-${{ github.ref_name }}.exe" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ steps.version.outputs.prerelease }}" -eq 'true') { $extra = @('--prerelease') }
          $assets = @("${{ steps.zip.outputs.zipName }}")
          if ("${{ steps.installer.outputs.setupName }}") { $assets += "${{ steps.installer.outputs.setupName }}" }
          gh release create "${{ github.ref_name }}" @assets `
            --title "Rewind GP ${{ github.ref_name }}" --generate-notes @extra
